# Конфигурация QQAssistant
# Автор: AllF1RE

# Основные настройки
settings:
  prefix: "&6QQAssist: "
  debug: false
  session-timeout: 60
  # Интервал отправки сообщений из actionbar!
  actionbar-refresh-ticks: 40
  # Настройка фората времени для аргументов
  time-formats:
    second: ["с", "сек", "секунд", "секунда", "секунды"]
    minute: ["м", "мин", "минут", "минута", "минуты"]
    hour: ["ч", "час", "часов"]
    day: ["д", "день", "дня", "дней"]
    week: ["нед", "неделя", "недели", "недель"]
    month: ["мес", "месяц", "месяца", "месяцев"]
    year: ["г", "год", "года", "лет"]
  # Настройки значений по умолчанию для заполнителей
  placeholder-defaults:
    target-name: "кто-то"          # если цель не указана
    target-parse: "не нашлось"     # если parse_ вернул пустоту
    target-data: "—"               # если target_* вернул null

# Алиасы для команды
aliases:
  - "qqa"
  - "qqassist"
  - "assist"
  - "assistant"
  - "bot"
  - "chatbot"

# Сообщения
messages:
  no_permission: "%prefix% &7У вас недостаточно прав"
  reload_success: "%prefix% &aКонфигурация перезагружена за %time%ms"
  unknown_command: "%prefix% &cНеизвестная команда"
  usage_reload: "%prefix% &cИспользование: /%alias% reload"
  usage_info: "%prefix% &cИспользование: /%alias% info"
  info_message:
    - "&6&lQQAssistant"
    - "&7Версия: &f1.0.0"
    - "&7Автор: &fAllF1RE"
    - "&7Помощь: &f/%alias% help"

# Паттерны для упоминаний (placeholder: {player})
mention-patterns:
  - "@{player}"
  - "#{player}"
  - "[{player}]"
  - "({player})"
  - "*{player}*"
  - "~{player}~"

# Правила ответов бота
