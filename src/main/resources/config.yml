    delay_ticks: 60
    permission: ""
    allowed-chats:
      - "global"
    condition: ""
    priority: 100
    chance: 100
    cooldown_ticks: 40
    questions:
      exact:
        - "привет"
        - "здравствуйте"
        - "здарова"
      regex:
        - "(?i)прив(ет|iвет|эт)"
        - "хай"
        - "hello"
        - "ку"
      contains: []
    answers:
      - "sound! ENTITY_PLAYER_LEVELUP 1.0 1.5"
