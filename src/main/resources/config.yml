# Пример правила с аргументами
  ban_player:
    delay_ticks: 0
    permission: "qqassist.admin"
    allowed-chats: []
    condition: ""
    priority: 100
    chance: 100
    cooldown_ticks: 60
    questions:
      contains:
        - "бот забань"
        - "бот, забань"
        - "бот, бань игрока"
        - "бот, забань игрока"
    session:
      enabled: true
      timeout: 600
      idle-timeout: 300
      idle-message: "message! %prefix% &rЖду ответ через &e%qqassist_session_idle_left%"
      cancel-message: "message! %prefix% &rВы слишком долго отвечали."
      cancel-triggers:
        - "отмена"
        - "стоп"
        - "cancel"
        - "отменить"
      skip-triggers:
        - "пропустить"
        - "дальше"
        - "skip"
      listen-chat: "same"
      steps:
        - id: "время"
          prompt: "message! %prefix% &rШаг 1/2: Введите время бана для &e%qqassist_session_target% &r(в часах, 1-5):"
          validate: "[1-5]"
          error: "message! %prefix% &rНеверно. Введите число от 1 до 5"
          default: "1"
        - id: "причина"
          prompt: "message! %prefix% &rШаг 2/2: Введите причину бана для &e%qqassist_session_target%&r:"
          validate: ".+"
          error: "message! %prefix% &rВам нужно указать причину!"
          default: "нарушение правил"
    answers:
      - "message! %prefix% &rБаню игрока &e%qqassist_session_target% &rна &e%qqassist_session_arg_время%ч &rза &e%qqassist_session_arg_причина%"
      - "asConsole! ban %qqassist_session_target% %qqassist_session_arg_время%ч %qqassist_session_arg_причина%"

